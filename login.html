<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://npmcdn.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://npmcdn.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://bixfhtemapsrahdrkaze.supabase.co; img-src 'self' data: https:;">
    <title>BD Tracking System R8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            color: #1e293b;
            /* ย้ายสีพื้นหลังไปไว้ที่ .rainbow-bg หมดแล้ว จึงลบโค้ดส่วนนี้ออกเพื่อไม่ให้ซ้ำซ้อน */
        }

        .apple-card {
            background: rgba(255, 255, 255, 0.45); /* โปร่งแสงมากขึ้นเพื่อให้เห็นสีรุ้งด้านหลังชัดๆ */
            backdrop-filter: blur(40px) saturate(150%); /* เบลอหนักขึ้น สีสดขึ้น */
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-radius: 24px;
            /* เงาสะท้อนสีรุ้งอ่อนๆ และขอบกระจกให้กลืนกับตีม */
            box-shadow: 
                0 25px 50px -12px rgba(168, 85, 247, 0.15),
                0 0 30px rgba(147, 197, 253, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 0 20px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .apple-card:hover {
            box-shadow: 
                0 30px 60px -15px rgba(253, 186, 116, 0.25),
                0 0 40px rgba(134, 239, 172, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            transform: translateY(-5px);
        }

        .apple-input {
            background: rgba(255, 255, 255, 0.55) !important;
            border: 1px solid rgba(255, 255, 255, 0.8) !important;
            border-radius: 14px;
            padding: 14px 18px;
            width: 100%;
            transition: all 0.3s ease;
            color: #1e293b !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .apple-input:focus {
            background: #ffffff !important;
            border-color: #c4b5fd !important; /* เส้นขอบสีม่วงพาสเทลตอนพิมพ์ */
            box-shadow: 0 0 0 4px rgba(196, 181, 253, 0.3), inset 0 2px 4px rgba(0,0,0,0.02) !important;
            outline: none;
        }

        .apple-btn-primary {
            /* สีปุ่มไล่เฉดให้เข้ากับรุ้งด้านล่าง */
            background: linear-gradient(135deg, #f43f5e, #a855f7, #3b82f6);
            background-size: 200% 200%;
            animation: btnRainbow 5s ease infinite;
            color: #ffffff;
            border-radius: 14px;
            padding: 14px 28px;
            font-weight: 600;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(168, 85, 247, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        @keyframes btnRainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .apple-btn-primary:hover {
            box-shadow: 0 15px 30px -5px rgba(168, 85, 247, 0.6), inset 0 1px 0 rgba(255,255,255,0.5);
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.15);
        }

        /* SweetAlert light mode */
        .swal2-popup {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 1) !important;
            color: #1e293b !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15) !important;
        }

        .swal2-title,
        .swal2-html-container {
            color: #1e293b !important;
        }

        .swal2-container.swal2-backdrop-show {
            background: rgba(248, 250, 252, 0.8) !important;
            backdrop-filter: blur(8px) !important;
        }

        /* Elegant Aurora Rainbow Background */
        .rainbow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #f8fafc;
            /* สีพื้นเรียบหรู (Slate 50) */
        }

        /* สร้างแถบสีรุ้งแนวนอนด้านล่าง และทำอนิเมชันให้พริ้วเหมือนธงสะบัด (Waving Flag) */
        .rainbow-bg::after {
            content: '';
            position: absolute;
            /* ขยายขนาดให้ล้นขอบจอลงไปด้านล่าง เพื่อไม่ให้เห็นขอบขาวเวลาธงยกตัว */
            bottom: -15vh; /* ปรับให้แสงรุ้งต่ำลงมาอีกนิด */
            left: -5vw;
            width: 110vw; /* เผื่อขอบไว้เวลาธงเอียง (Skew) */
            height: 45vh; /* เพิ่มความสูงชดเชยส่วนที่ล้นลงไปด้านล่าง */
            
            background-image: 
                /* 1. เลเยอร์เงาและแสงสะท้อน (สร้างรอยพับของธงให้เนียนละมุนขึ้น ไร้รอยต่อขอบ) */
                linear-gradient(to right, 
                    rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 12.5%, rgba(255,255,255,0) 25%, rgba(0,0,0,0.05) 37.5%, 
                    rgba(255,255,255,0) 50%, rgba(255,255,255,0.2) 62.5%, rgba(255,255,255,0) 75%, rgba(0,0,0,0.05) 87.5%, rgba(255,255,255,0) 100%
                ),
                /* 2. เลเยอร์สีรุ้ง (2 รอบเต็มๆ ใน 1 ชุด เพื่อหลีกเลี่ยงขอบเส้นแข็งจาก repeating) */
                linear-gradient(to right, 
                    #fca5a5 0%, #fdba74 8.3%, #fcd34d 16.6%, #86efac 25%, #93c5fd 33.3%, #c4b5fd 41.6%,
                    #fca5a5 50%, #fdba74 58.3%, #fcd34d 66.6%, #86efac 75%, #93c5fd 83.3%, #c4b5fd 91.6%,
                    #fca5a5 100%
                );
            
            /* กำหนดให้ภาพกว้าง 2 เท่าของหน้าจอ (200vw) เพื่อให้เลื่อนได้ */
            background-size: 200vw 100%;
            
            /* แอนิเมชัน 2 ตัว: เลื่อนสี+เงา (flowWave) และ โยกขึ้นลง (flap) */
            animation: 
                flagFlow 15s linear infinite,
                flagFlap 4s ease-in-out infinite alternate;
            
            /* ใช้เทคนิค Mask เฟดสีให้กลืนไปกับพื้นหลังด้านบน */
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            transform-origin: bottom center;
        }

        /* อนิเมชันเลื่อนเนื้อธงและรอยพับไปทางซ้าย ด้วยความเร็วที่ต่างกัน (Parallax Effect) */
        @keyframes flagFlow {
            0% {
                background-position: 0vw 0, 0vw 0;
            }

            /* 150 = เลื่อนเงา 3 ลอน, 200 = เลื่อนสีรุ้ง 1 รอบ */
            100% {
                background-position: -150vw 0, -200vw 0;
            }
        }

        /* อนิเมชันโยกตัวผ้า (สะบัดขึ้นลง+เอียงเล็กน้อย เหมือนโดนลมพัด) */
        @keyframes flagFlap {
            0% {
                transform: scaleY(1) skewY(1deg) translateY(0);
            }

            100% {
                transform: scaleY(1.15) skewY(-1.5deg) translateY(-10px);
            }
        }

        /* Success Overlay */
        .success-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* ปรับให้ใสมองทะลุเห็นรุ้งได้ชัดขึ้น (จาก 0.85 เหลือ 0.55) */
            background: rgba(255, 255, 255, 0.55);
            /* เพิ่มความเบลอและดึงสีรุ้งให้สดขึ้น เพื่อไม่ให้รุ้งดูจืดหรือหม่น */
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 2rem;
            animation: spin 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .petal-wrapper {
            position: absolute;
            width: 160px;
            height: 160px;
            transform: rotate(var(--deg));
        }

        .petal {
            position: absolute;
            width: 30px;
            height: 60px;
            border-radius: 100% 0% 100% 0% / 100% 0% 100% 0%;
            top: 5px;
            left: 65px;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            box-shadow: 0 0 15px var(--c1);
            transform-origin: center;
            opacity: 0.9;
            animation: expand 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes expand {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) scale(1.1) rotate(180deg);
            }

            100% {
                transform: translateY(0) scale(1) rotate(360deg);
            }
        }
    </style>
    <style id="anti-fouc">
        body {
            display: none !important;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
    onload="document.getElementById('anti-fouc').remove()">



    <!-- Static Rainbow Background -->
    <div class="rainbow-bg"></div>

    <div class="apple-card p-8 sm:p-12 w-full max-w-md relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">เข้าสู่ระบบ</h1>
            <p class="text-sm text-slate-500">BD Tracking System R8</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" class="apple-input">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">รหัสผ่าน (Password)</label>
                <input type="password" id="password" class="apple-input">
            </div>
            <button type="submit" id="loginBtn" class="apple-btn-primary mt-4">
                ลงชื่อเข้าใช้
            </button>
        </form>
    </div>

    <!-- Success Overlay -->
    <div id="successOverlay" class="success-overlay">
        <div class="spinner">
            <div class="petal-wrapper" style="--deg: 0deg;">
                <div class="petal" style="--c1: #ff4b2b; --c2: #ff416c;"></div>
            </div>
            <div class="petal-wrapper" style="--deg: 45deg;">
                <div class="petal" style="--c1: #ff416c; --c2: #d8367c;"></div>
            </div>
            <div class="petal-wrapper" style="--deg: 90deg;">
                <div class="petal" style="--c1: #d8367c; --c2: #a855f7;"></div>
            </div>
            <div class="petal-wrapper" style="--deg: 135deg;">
                <div class="petal" style="--c1: #a855f7; --c2: #8b5cf6;"></div>
            </div>
            <div class="petal-wrapper" style="--deg: 180deg;">
                <div class="petal" style="--c1: #8b5cf6; --c2: #6366f1;"></div>
            </div>
            <div class="petal-wrapper" style="--deg: 225deg;">
                <div class="petal" style="--c1: #6366f1; --c2: #3b82f6;"></div>
            </div>
            <div class="petal-wrapper" style="--deg: 270deg;">
                <div class="petal" style="--c1: #3b82f6; --c2: #0ea5e9;"></div>
            </div>
            <div class="petal-wrapper" style="--deg: 315deg;">
                <div class="petal" style="--c1: #0ea5e9; --c2: #ff4b2b;"></div>
            </div>
        </div>
        <h2 class="text-3xl font-bold text-slate-800 mb-3 tracking-wider">เข้าสู่ระบบสำเร็จ</h2>
        <p class="text-slate-500 text-lg">ระบบกำลังนำท่านเข้าสู่หน้าหลัก กรุณารอสักครู่...</p>
    </div>

    <script>
        // --- 1. ตั้งค่าการเชื่อมต่อ ---
        // (อย่าลืมแก้ไข 2 บรรทัดนี้ให้เป็น API Key ของโปรเจกต์คุณ)
        const SUPABASE_URL = 'https://bixfhtemapsrahdrkaze.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpeGZodGVtYXBzcmFoZHJrYXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNzM4MzUsImV4cCI6MjA5ODc0OTgzNX0.JNt7w7LXfBJlmDp0POy-UvolL-Rrk0yI-zne6iYc_P0';

        // *แก้ไขตัวแปรเป็น supabaseClient เพื่อป้องกัน Error การประกาศชื่อซ้ำ
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                storage: window.sessionStorage // 🌟 ยกระดับความปลอดภัย: ปิดเบราว์เซอร์ = ล็อกเอาต์ทันที
            }
        });

        // โดเมนจำลองสำหรับระบบภายในองค์กร
        const INTERNAL_DOMAIN = '@r8.local';

        // --- 2. ฟังก์ชันจัดการการเข้าสู่ระบบ ---
        async function handleLogin() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            // รวม Username เข้ากับโดเมนจำลอง เพื่อส่งให้ Supabase ตรวจสอบ
            const mappedEmail = usernameInput + INTERNAL_DOMAIN;

            // เปลี่ยนสถานะปุ่มตอนกำลังโหลด (Loading State)
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-slate-800 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังตรวจสอบ...`;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            // ส่งข้อมูลไปตรวจสอบที่ Supabase Auth โดยใช้ supabaseClient
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: mappedEmail,
                password: passwordInput,
            });

            if (error) {
                // กรณีล็อกอินไม่ผ่าน
                Swal.fire({
                    icon: 'error',
                    title: 'เข้าสู่ระบบไม่สำเร็จ',
                    text: 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง',
                    confirmButtonColor: '#1e3c72',
                    customClass: { popup: 'rounded-[20px]' }
                });
                btn.disabled = false;
                btn.innerHTML = 'ลงชื่อเข้าใช้';
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            } else {
                // กรณีล็อกอินสำเร็จ
                document.querySelector('.apple-card').style.opacity = '0';
                document.querySelector('.apple-card').style.transform = 'scale(0.9)';
                document.querySelector('.apple-card').style.pointerEvents = 'none';

                const overlay = document.getElementById('successOverlay');
                overlay.classList.add('active');

                setTimeout(() => {
                    // Redirect ไปยังหน้าหลัก
                    window.location.href = 'index.html';
                }, 3000);
            }
        }
    </script>
</body>

</html>
