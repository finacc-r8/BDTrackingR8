<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Tracking System R8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #030514;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(91, 33, 182, 0.2), transparent 40%), 
                radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.15), transparent 40%);
            color: #ededed;
            background-attachment: fixed;
        }
        .apple-card {
            background: rgba(10, 15, 30, 0.25);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.5s ease;
        }
        .apple-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(14, 165, 233, 0.1);
        }
        .apple-input {
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px;
            padding: 14px 16px;
            width: 100%;
            transition: all 0.2s ease;
            color: #ffffff !important;
        }
        .apple-input:focus {
            background: rgba(0, 0, 0, 0.5) !important;
            border-color: #0ea5e9 !important;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.2) !important;
            outline: none;
        }
        .apple-btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%);
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 28px;
            font-weight: 500;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .apple-btn-primary:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
            transform: translateY(-1px);
            filter: brightness(1.1);
        }
        /* SweetAlert dark mode */
        .swal2-popup { background: #0b1120 !important; border: 1px solid rgba(255,255,255,0.1) !important; color: #ededed !important; }
        .swal2-title, .swal2-html-container { color: #ededed !important; }
        /* Twinkling Stars */
        .stars-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; }
        .star-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='40' r='1' fill='rgba(255,255,255,0.8)'/%3E%3Ccircle cx='120' cy='80' r='1.5' fill='rgba(255,255,255,1)'/%3E%3Ccircle cx='80' cy='150' r='0.5' fill='rgba(255,255,255,0.6)'/%3E%3Ccircle cx='180' cy='20' r='2' fill='rgba(255,255,255,0.9)'/%3E%3Ccircle cx='160' cy='140' r='1' fill='rgba(255,255,255,0.7)'/%3E%3C/svg%3E"); }
        .star-layer-1 { animation: twinkle 4s ease-in-out infinite alternate; }
        .star-layer-2 { background-position: 50px 50px; transform: scale(1.2); animation: twinkle 5s ease-in-out infinite alternate-reverse; }
        .star-layer-3 { background-position: 120px 80px; transform: scale(0.8) rotate(45deg); animation: twinkle 6s ease-in-out infinite alternate 2s; }
        @keyframes twinkle { 0% { opacity: 0.1; } 100% { opacity: 0.8; } }
        /* Masterpiece Rotating Rings */
        .rings-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100vw; height: 100vh; overflow: hidden; z-index: -1; perspective: 1200px; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        .ring { position: absolute; border-radius: 50%; transform-style: preserve-3d; }
        .ring-1 { width: 120vmin; height: 120vmin; border: 1px solid rgba(14, 165, 233, 0.15); border-top: 2px solid rgba(14, 165, 233, 0.8); box-shadow: 0 0 30px rgba(14, 165, 233, 0.2), inset 0 0 30px rgba(14, 165, 233, 0.2); animation: rotate1 30s linear infinite; }
        .ring-2 { width: 95vmin; height: 95vmin; border: 2px dashed rgba(91, 33, 182, 0.4); animation: rotate2 45s linear infinite; }
        .ring-3 { width: 70vmin; height: 70vmin; border: 1px solid rgba(255, 255, 255, 0.05); border-right: 2px solid rgba(255, 255, 255, 0.4); box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); animation: rotate3 20s linear infinite; }
        .orb-1 { position: absolute; width: 45vmin; height: 45vmin; background: radial-gradient(circle, rgba(14, 165, 233, 0.5) 0%, transparent 70%); border-radius: 50%; filter: blur(25px); animation: floatOrb1 15s ease-in-out infinite alternate; }
        .orb-2 { position: absolute; width: 60vmin; height: 60vmin; background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, transparent 70%); border-radius: 50%; filter: blur(30px); animation: floatOrb2 20s ease-in-out infinite alternate-reverse; }
        @keyframes rotate1 { 0% { transform: rotateX(65deg) rotateY(15deg) rotateZ(0deg); } 100% { transform: rotateX(65deg) rotateY(15deg) rotateZ(360deg); } }
        @keyframes rotate2 { 0% { transform: rotateX(75deg) rotateY(-10deg) rotateZ(360deg); } 100% { transform: rotateX(75deg) rotateY(-10deg) rotateZ(0deg); } }
        @keyframes rotate3 { 0% { transform: rotateX(55deg) rotateY(25deg) rotateZ(0deg); } 100% { transform: rotateX(55deg) rotateY(25deg) rotateZ(360deg); } }
        @keyframes floatOrb1 { 0% { transform: translate(-40vw, -30vh) scale(0.8); opacity: 0.5; } 100% { transform: translate(40vw, 30vh) scale(1.2); opacity: 1; } }
        @keyframes floatOrb2 { 0% { transform: translate(30vw, -40vh) scale(1.2); opacity: 1; } 100% { transform: translate(-30vw, 40vh) scale(0.8); opacity: 0.6; } }
        
        /* Success Overlay Planet */
        .success-overlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(3, 5, 20, 0.85); backdrop-filter: blur(12px); opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
        .success-overlay.active { opacity: 1; pointer-events: auto; }
        .planet-container { position: relative; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem; perspective: 1000px; transform-style: preserve-3d; }
        .planet { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, rgba(15, 5, 35, 0.95) 0%, rgba(60, 20, 110, 0.85) 60%, rgba(200, 100, 255, 0.9) 100%); box-shadow: 0 0 50px rgba(147, 51, 234, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.5), inset 10px 0 40px rgba(216, 180, 254, 0.8), inset -10px 0 40px rgba(168, 85, 247, 0.8); backdrop-filter: blur(8px); animation: pulsePlanet 4s infinite alternate ease-in-out, spinPlanet 12s linear infinite; transform: translateZ(0); }
        @keyframes pulsePlanet { 0% { box-shadow: 0 0 40px rgba(147, 51, 234, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.4), inset 10px 0 30px rgba(216, 180, 254, 0.6), inset -10px 0 30px rgba(168, 85, 247, 0.6); } 100% { box-shadow: 0 0 80px rgba(168, 85, 247, 0.9), inset 0 0 25px rgba(255, 255, 255, 0.7), inset 10px 0 50px rgba(216, 180, 254, 0.9), inset -10px 0 50px rgba(168, 85, 247, 0.9); } }
        @keyframes spinPlanet { 0% { transform: translateZ(0) rotate(0deg); } 100% { transform: translateZ(0) rotate(360deg); } }
        .orbit-wrapper { position: absolute; width: 280px; height: 280px; transform-style: preserve-3d; }
        .ow-1 { transform: rotateZ(20deg) rotateX(70deg); }
        .ow-2 { transform: rotateZ(-40deg) rotateX(70deg); }
        .ow-3 { transform: rotateZ(70deg) rotateX(70deg); }
        .orbit-path-inner { width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); border-top: 2px solid rgba(255,255,255,0.5); position: absolute; transform-style: preserve-3d; }
        .op-1 { animation: orbitSpinInner 5s linear infinite; }
        .op-2 { animation: orbitSpinInner 8s linear infinite reverse; }
        .op-3 { animation: orbitSpinInner 6s linear infinite; }
        .moon-inner { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); border-radius: 50%; box-shadow: 0 0 20px currentColor, 0 0 40px currentColor; background: currentColor; }
        .moon-inner-1 { width: 12px; height: 12px; color: #d8b4fe; }
        .moon-inner-2 { width: 8px; height: 8px; color: #38bdf8; }
        .moon-inner-3 { width: 14px; height: 14px; color: #fb923c; }
        @keyframes orbitSpinInner { 0% { transform: rotateZ(0deg); } 100% { transform: rotateZ(360deg); } }
    </style>
    <style id="anti-fouc">
        body { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden" onload="document.getElementById('anti-fouc').remove()">

    <!-- Twinkling Stars Background -->
    <div class="stars-bg">
        <div class="star-layer star-layer-1"></div>
        <div class="star-layer star-layer-2"></div>
        <div class="star-layer star-layer-3"></div>
    </div>

    <!-- Masterpiece Rings Animation -->
    <div class="rings-container">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
    </div>

    <div class="apple-card p-8 sm:p-12 w-full max-w-md relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white mb-2">เข้าสู่ระบบ</h1>
            <p class="text-sm text-gray-400">BD Tracking System R8</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" class="space-y-6">
            <div>
                <label class="text-[13px] font-semibold text-gray-300 mb-2 block uppercase tracking-wide">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" class="apple-input">
            </div>
            <div>
                <label class="text-[13px] font-semibold text-gray-300 mb-2 block uppercase tracking-wide">รหัสผ่าน (Password)</label>
                <input type="password" id="password" class="apple-input">
            </div>
            <button type="submit" id="loginBtn" class="apple-btn-primary mt-4">
                ลงชื่อเข้าใช้
            </button>
        </form>
    </div>

    <!-- Success Landing Animation Overlay -->
    <div id="successOverlay" class="success-overlay">
        <div class="planet-container">
            <div class="planet"></div>
            <div class="orbit-wrapper ow-1"><div class="orbit-path-inner op-1"><div class="moon-inner moon-inner-1"></div></div></div>
            <div class="orbit-wrapper ow-2"><div class="orbit-path-inner op-2"><div class="moon-inner moon-inner-2"></div></div></div>
            <div class="orbit-wrapper ow-3"><div class="orbit-path-inner op-3"><div class="moon-inner moon-inner-3"></div></div></div>
        </div>
        <h2 class="text-3xl font-bold text-white mb-3 tracking-wider animate-pulse">เข้าสู่ระบบสำเร็จ</h2>
        <p class="text-sky-300 text-lg">ระบบกำลังนำท่านเข้าสู่หน้าหลัก กรุณารอสักครู่...</p>
    </div>

    <script>
        // --- 1. ตั้งค่าการเชื่อมต่อ ---
        // (อย่าลืมแก้ไข 2 บรรทัดนี้ให้เป็น API Key ของโปรเจกต์คุณ)
        const SUPABASE_URL = 'https://bixfhtemapsrahdrkaze.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpeGZodGVtYXBzcmFoZHJrYXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNzM4MzUsImV4cCI6MjA5ODc0OTgzNX0.JNt7w7LXfBJlmDp0POy-UvolL-Rrk0yI-zne6iYc_P0';
        
        // *แก้ไขตัวแปรเป็น supabaseClient เพื่อป้องกัน Error การประกาศชื่อซ้ำ
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // โดเมนจำลองสำหรับระบบภายในองค์กร
        const INTERNAL_DOMAIN = '@r8.local';

        // --- 2. ฟังก์ชันจัดการการเข้าสู่ระบบ ---
        async function handleLogin() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            // รวม Username เข้ากับโดเมนจำลอง เพื่อส่งให้ Supabase ตรวจสอบ
            const mappedEmail = usernameInput + INTERNAL_DOMAIN;

            // เปลี่ยนสถานะปุ่มตอนกำลังโหลด (Loading State)
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังตรวจสอบ...`;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            // ส่งข้อมูลไปตรวจสอบที่ Supabase Auth โดยใช้ supabaseClient
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: mappedEmail,
                password: passwordInput,
            });

            if (error) {
                // กรณีล็อกอินไม่ผ่าน
                Swal.fire({ 
                    icon: 'error', 
                    title: 'เข้าสู่ระบบไม่สำเร็จ', 
                    text: 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง',
                    confirmButtonColor: '#1e3c72',
                    customClass: { popup: 'rounded-[20px]' }
                });
                btn.disabled = false;
                btn.innerHTML = 'ลงชื่อเข้าใช้';
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            } else {
                // กรณีล็อกอินสำเร็จ
                document.querySelector('.apple-card').style.opacity = '0';
                document.querySelector('.apple-card').style.transform = 'scale(0.9)';
                document.querySelector('.apple-card').style.pointerEvents = 'none';
                
                const overlay = document.getElementById('successOverlay');
                overlay.classList.add('active');
                
                setTimeout(() => {
                    // Redirect ไปยังหน้าหลัก
                    window.location.href = 'index.html'; 
                }, 3000);
            }
        }
    </script>
</body>
</html>
